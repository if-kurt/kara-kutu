# One kernel parameter per line (pmaports kernel-cmdline.d format).
# The bootloader does not pass a command line to the mainline kernel and the
# shipped config has an empty CONFIG_CMDLINE: tools/pack-kernel-partition.sh
# writes these lines into the DTB (/chosen/bootargs). pmOS parameters such as
# pmos_root_uuid / pmos_boot_uuid only take effect that way.
earlycon=pl011,mmio32,0xfff32000
console=ttyAMA6,115200
console=tty0
ignore_loglevel
consoleblank=0
fbcon=font:TER16x32
panic=0
printk.devkmsg=on
clk_ignore_unused
